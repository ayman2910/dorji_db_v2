<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Materials - Smart Dorji Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="/dashboard" class="text-xl font-bold text-indigo-600">Smart Dorji Shop</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/styles" class="text-gray-700 hover:text-indigo-600 font-medium transition">Manage Styles</a>
                <a href="/inventory" class="text-gray-700 hover:text-indigo-600 font-medium transition">Inventory</a>
                <a href="/orders" class="text-indigo-600 font-medium">Orders</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">
                        Sign Out
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <div class="px-4 py-6 sm:px-0">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-semibold text-gray-800" th:text="'Materials for Order #' + ${orderId}">Materials for Order #1</h1>
            <a href="/orders" class="text-gray-600 hover:text-indigo-600 font-medium transition">Back to Orders</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white shadow rounded-lg overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-800">Fabric Materials</h2>
                </div>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Type</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Color</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Length (m)</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="f : ${fabrics}">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800" th:text="${f.Material_Type}">Type</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800" th:text="${f.Color}">Color</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800" th:text="${f.Length_Meters}">0.00</td>
                        </tr>
                        <tr th:if="${fabrics.empty}">
                            <td colspan="3" class="px-6 py-4 text-center text-sm text-gray-500">No fabric recorded yet.</td>
                        </tr>
                    </tbody>
                </table>
                <form th:action="@{|/orders/${orderId}/materials/fabric|}" method="post" class="p-6 border-t border-gray-200 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Material Type</label>
                        <input type="text" name="materialType" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Color</label>
                        <input type="text" name="color" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Length (meters)</label>
                        <input type="number" name="lengthMeters" step="0.01" min="0.01" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">Add Fabric</button>
                    </div>
                </form>
            </div>

            <div class="bg-white shadow rounded-lg overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-lg font-semibold text-gray-800">Inventory Consumption</h2>
                </div>
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Item Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Quantity Used</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200">
                        <tr th:each="c : ${consumed}">
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800" th:text="${c.Item_Name}">Item</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800" th:text="${c.Quantity_Used}">0</td>
                        </tr>
                        <tr th:if="${consumed.empty}">
                            <td colspan="2" class="px-6 py-4 text-center text-sm text-gray-500">No inventory consumed yet.</td>
                        </tr>
                    </tbody>
                </table>
                <form th:action="@{|/orders/${orderId}/materials/consume|}" method="post" class="p-6 border-t border-gray-200 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Item</label>
                        <select name="itemId" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="">Select an item</option>
                            <option th:each="item : ${inventoryItems}"
                                    th:value="${item.Item_ID}"
                                    th:text="${item.Item_Name + ' (Stock: ' + item.Current_Stock_Qty + ')'}">Item</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Quantity Used</label>
                        <input type="number" name="quantityUsed" min="1" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">Consume Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</main>
</body>
</html>
