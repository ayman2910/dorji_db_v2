<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Measurements - Smart Dorji Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-indigo-600">Smart Dorji Shop</span>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/" class="text-gray-700 hover:text-indigo-600 font-medium transition">Dashboard</a>
                    <a href="/styles" class="text-indigo-600 font-medium">Styles</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="px-4 sm:px-0">
            <div class="max-w-2xl mx-auto">
                <div class="bg-white shadow rounded-lg p-6">
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <h2 class="text-2xl font-bold text-gray-900">Manage Measurements</h2>
                            <p class="text-gray-600 mt-1" th:text="'Style: ' + ${style.Style_name}">Style Name</p>
                        </div>
                        <a href="/styles" class="text-indigo-600 hover:text-indigo-900 font-medium transition">← Back to Styles</a>
                    </div>

                    <div class="mb-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-3">Current Measurement Requirements</h3>
                        <div class="bg-gray-50 rounded-lg p-4">
                            <div th:if="${requirements == null or requirements.size() == 0}" class="text-gray-500 text-center py-4">
                                No measurement requirements defined yet. Add one below.
                            </div>
                            <div th:if="${requirements != null and requirements.size() > 0}" class="space-y-2">
                                <div th:each="req : ${requirements}" class="flex items-center justify-between bg-white p-3 rounded border border-gray-200">
                                    <span class="text-gray-900 font-medium" th:text="${req.Measurement_Name}">Measurement Name</span>
                                    <form th:action="@{|/styles/${style.Style_ID}/measurements/delete|}" method="post" class="inline">
                                        <input type="hidden" name="measurementName" th:value="${req.Measurement_Name}">
                                        <button type="submit"
                                                class="bg-red-600 hover:bg-red-700 text-white text-sm font-medium py-1.5 px-3 rounded transition duration-150 ease-in-out"
                                                onclick="return confirm('Delete this measurement requirement?');">
                                            Delete
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="border-t border-gray-200 pt-6">
                        <h3 class="text-lg font-semibold text-gray-900 mb-3">Add New Measurement Requirement</h3>
                        <form th:action="@{|/styles/${style.Style_ID}/measurements|}" method="post" class="flex gap-3">
                            <input type="text"
                                   name="measurementName"
                                   required
                                   placeholder="e.g., Sleeve Length"
                                   class="flex-1 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                            <button type="submit"
                                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition duration-150 ease-in-out whitespace-nowrap">
                                Add Measurement
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
