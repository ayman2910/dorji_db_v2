<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item - Smart Dorji Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="/dashboard" class="text-xl font-bold text-indigo-600">Smart Dorji Shop</a>
            </div>
            <div class="flex items-center space-x-4">
                <a th:if="${isTailor}" href="/styles" class="text-gray-700 hover:text-indigo-600 font-medium transition">Manage Styles</a>
                <a th:if="${isTailor}" href="/inventory" class="text-gray-700 hover:text-indigo-600 font-medium transition">Inventory</a>
                <span class="text-gray-700" th:text="'Hello, ' + ${username}">User</span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">
                        Sign Out
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <div class="px-4 py-6 sm:px-0">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-semibold text-gray-800">Edit Inventory Item</h1>
            <a href="/inventory" class="text-gray-600 hover:text-indigo-600 font-medium transition">Back to Inventory</a>
        </div>

        <div class="bg-white shadow rounded-lg">
            <form th:action="@{|/inventory/${item.Item_ID}|}" method="post" class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Item Name</label>
                        <!-- Using th:value mapped to the exact SQL column name: Item_Name -->
                        <input type="text" name="itemName" th:value="${item.Item_Name}" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Current Stock Qty</label>
                        <input type="number" name="currentStockQty" th:value="${item.Current_Stock_Qty}" min="0" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Unit Cost</label>
                        <input type="number" name="unitCost" th:value="${item.Unit_Cost}" step="0.01" min="0" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Reorder Level</label>
                        <input type="number" name="reorderLevel" th:value="${item.Reorder_Level}" min="0" required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>

                <div class="flex justify-end space-x-4 mt-6 pt-6 border-t border-gray-200">
                    <a href="/inventory" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">Cancel</a>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">Update</button>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
