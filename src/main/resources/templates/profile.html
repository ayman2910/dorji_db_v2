<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Smart Dorji Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="/dashboard" class="text-xl font-bold text-indigo-600">Smart Dorji Shop</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/dashboard" class="text-gray-700 hover:text-indigo-600 font-medium transition">Dashboard</a>
                <a href="/styles" class="text-gray-700 hover:text-indigo-600 font-medium transition">Manage Styles</a>
                <a href="/inventory" class="text-gray-700 hover:text-indigo-600 font-medium transition">Inventory</a>
                <a href="/orders" class="text-gray-700 hover:text-indigo-600 font-medium transition">Orders</a>
                <a href="/customers" class="text-gray-700 hover:text-indigo-600 font-medium transition">Customers</a>
                <a href="/audit-logs" class="text-gray-700 hover:text-indigo-600 font-medium transition">Audit Logs</a>
                <a th:if="${session.isMasterAdmin}" href="/admin/tailors" class="text-gray-700 hover:text-indigo-600 font-medium transition">Approvals</a>
                <a href="/profile" class="text-indigo-600 font-medium">Profile</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">
                        Sign Out
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <div class="px-4 sm:px-0 grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <!-- Profile Form Section -->
        <div class="md:col-span-1">
            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-2xl font-bold text-gray-900 mb-6">My Profile</h2>
                
                <form th:action="@{/profile}" method="post" class="space-y-4">
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                        <input type="text"
                               id="firstName"
                               name="firstName"
                               required
                               th:value="${profile.First_name}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>

                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                        <input type="text"
                               id="lastName"
                               name="lastName"
                               required
                               th:value="${profile.Last_name}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>

                    <div th:if="${profile.Role == 'TAILOR'}">
                        <label for="specialty" class="block text-sm font-medium text-gray-700 mb-1">Specialty</label>
                        <input type="text"
                               id="specialty"
                               name="specialty"
                               th:value="${profile.Specialty}"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    </div>
                    
                    <div class="pt-4 border-t border-gray-200">
                        <button type="submit"
                                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">
                            Update Profile
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Personal Logs Section -->
        <div class="md:col-span-2">
            <div class="bg-white shadow rounded-lg p-6 h-full">
                <h3 class="text-lg font-medium text-gray-900 mb-4">My Activity Logs</h3>
                
                <div class="overflow-hidden overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Time</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Action</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Target</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Details</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="log : ${myLogs}" class="hover:bg-gray-50">
                                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-500" th:text="${log.Log_Timestamp}">Time</td>
                                <td class="px-4 py-3 whitespace-nowrap text-sm">
                                    <span th:text="${log.Action_Type}" 
                                          th:class="${'px-2 inline-flex text-xs leading-5 font-semibold rounded-full ' + (log.Action_Type == 'INSERT' ? 'bg-green-100 text-green-800' : (log.Action_Type == 'UPDATE' ? 'bg-blue-100 text-blue-800' : 'bg-red-100 text-red-800'))}">
                                        Action
                                    </span>
                                </td>
                                <td class="px-4 py-3 whitespace-nowrap text-sm text-gray-900" th:text="${log.Target_Table}">Table</td>
                                <td class="px-4 py-3 text-sm text-gray-500">
                                    <div th:if="${log.Old_Value != null}" class="text-xs">
                                        <span class="text-gray-400">Old:</span> <span th:text="${log.Old_Value}"></span>
                                    </div>
                                    <div th:if="${log.New_Value != null}" class="text-xs">
                                        <span class="text-gray-400">New:</span> <span th:text="${log.New_Value}"></span>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${myLogs == null or myLogs.empty}">
                                <td colspan="4" class="px-4 py-8 text-center text-gray-500 text-sm">No activity logs found.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</main>
</body>
</html>
