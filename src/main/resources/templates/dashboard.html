<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard - Smart Dorji Shop</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-50 min-h-screen">

<nav class="bg-white shadow-sm">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="flex justify-between h-16">

            <div class="flex items-center">

                <span class="text-xl font-bold text-indigo-600">Smart Dorji Shop</span>

            </div>

            <div class="flex items-center space-x-4">
                            <a th:if="${isTailor}" href="/styles" class="text-gray-700 hover:text-indigo-600 font-medium transition">Manage Styles</a>
                            <a th:if="${isTailor}" href="/inventory" class="text-gray-700 hover:text-indigo-600 font-medium transition">Inventory</a>
                            <span class="text-gray-700" th:text="'Hello, ' + ${username}">User</span>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">
                                    Sign Out
                                </button>
                            </form>
                        </div>

        </div>

    </div>

</nav>



<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">

    <div class="px-4 py-6 sm:px-0">

        <div class="border-4 border-dashed border-gray-200 rounded-lg h-96 flex items-center justify-center">

            <h1 class="text-3xl font-semibold text-gray-400">Welcome to your Dashboard</h1>

        </div>

    </div>

</main>

</body>

</html>
