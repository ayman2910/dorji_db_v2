<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management - Smart Dorji Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div th:replace="~{fragments/navbar :: tailorNav}"></div>

<main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
    <div class="px-4 py-6 sm:px-0">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-semibold text-gray-800">Customer Management</h1>
            <div class="flex items-center space-x-4">
                <a href="/customers/new" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">Register New Customer</a>
                <a href="/dashboard" class="text-gray-600 hover:text-indigo-600 font-medium transition">Back to Dashboard</a>
            </div>
        </div>

        <div class="bg-white shadow rounded-lg overflow-hidden">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">City</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr th:each="customer : ${customers}" class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900" th:text="${customer.First_name + ' ' + customer.Last_name}">John Doe</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800" th:text="${customer.Username}">johndoe</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800" th:text="${customer.Phone_Number != null ? customer.Phone_Number : 'N/A'}">17123456</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-800" th:text="${customer.City != null ? customer.City : 'N/A'}">Thimphu</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm">
                            <form th:action="@{|/customers/${customer.USER_ID}/delete|}" method="post" class="inline" onsubmit="return confirm('Are you sure you want to delete this customer?');">
                                <button type="submit" class="text-red-600 hover:text-red-800 font-medium">Delete</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${customers == null or customers.empty}">
                        <td colspan="5" class="px-6 py-8 text-center text-sm text-gray-500">No customers found. Click "Register New Customer" to add one.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
