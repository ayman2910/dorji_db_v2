<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
</head>
<body>

<!-- Tailor / Admin Navbar Fragment -->
<nav th:fragment="tailorNav" class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="/dashboard" class="text-xl font-bold text-indigo-600">Smart Dorji Shop</a>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/dashboard" class="text-gray-700 hover:text-indigo-600 font-medium transition">Dashboard</a>
                <a href="/styles" class="text-gray-700 hover:text-indigo-600 font-medium transition">Manage Styles</a>
                <a href="/inventory" class="text-gray-700 hover:text-indigo-600 font-medium transition">Inventory</a>
                <a href="/orders" class="text-gray-700 hover:text-indigo-600 font-medium transition">Orders</a>
                <a href="/customers" class="text-gray-700 hover:text-indigo-600 font-medium transition">Customers</a>
                <a href="/audit-logs" class="text-gray-700 hover:text-indigo-600 font-medium transition">Audit Logs</a>
                <a th:if="${session.isMasterAdmin}" href="/admin/approvals" class="text-gray-700 hover:text-indigo-600 font-medium transition">Approvals</a>
                <span class="text-gray-700 text-sm font-medium">Hello, <span sec:authentication="name"></span></span>
                <a href="/profile" class="text-gray-700 hover:text-indigo-600 font-medium transition">Profile</a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">
                        Sign Out
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Customer Navbar Fragment -->
<nav th:fragment="customerNav" class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-50 border-b border-gray-100">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-lg flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/>
                    </svg>
                </div>
                <a href="/customer/dashboard" class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">Dorji App</a>
            </div>
            <div class="flex items-center space-x-3">
                <button id="profileToggle" onclick="toggleProfile()" class="flex items-center space-x-1.5 text-gray-600 hover:text-indigo-600 font-medium transition px-3 py-2 rounded-lg hover:bg-indigo-50">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <span>Profile</span>
                </button>
                <span class="text-sm text-gray-500 font-medium hidden sm:inline">Hello, <span sec:authentication="name"></span></span>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" class="bg-gray-100 hover:bg-red-50 hover:text-red-600 text-gray-700 font-semibold py-2 px-4 rounded-lg transition text-sm">
                        Sign Out
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
