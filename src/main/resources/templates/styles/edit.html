<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Style - Smart Dorji Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="/dashboard" class="text-xl font-bold text-indigo-600">Smart Dorji Shop</a>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="/dashboard" class="text-gray-700 hover:text-indigo-600 font-medium transition">Dashboard</a>
                    <a href="/styles" class="text-indigo-600 font-medium">Manage Styles</a>
                    <a href="/inventory" class="text-gray-700 hover:text-indigo-600 font-medium transition">Inventory</a>
                    <a href="/orders" class="text-gray-700 hover:text-indigo-600 font-medium transition">Orders</a>
                    <a href="/customers" class="text-gray-700 hover:text-indigo-600 font-medium transition">Customers</a>
                    <a href="/audit-logs" class="text-gray-700 hover:text-indigo-600 font-medium transition">Audit Logs</a>
                    <a th:if="${session.isMasterAdmin}" href="/admin/tailors" class="text-gray-700 hover:text-indigo-600 font-medium transition">Approvals</a>
                    <a href="/profile" class="text-gray-700 hover:text-indigo-600 font-medium transition">Profile</a>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">
                            Sign Out
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto py-6 sm:px-6 lg:px-8">
        <div class="px-4 sm:px-0">
            <div class="max-w-2xl mx-auto">
                <div class="bg-white shadow rounded-lg p-6">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">Edit Style Template</h2>

                    <form th:action="@{|/styles/${style.Style_ID}|}" method="post" class="space-y-4">
                        <div>
                            <label for="styleName" class="block text-sm font-medium text-gray-700 mb-1">Style Name</label>
                            <input type="text"
                                   id="styleName"
                                   name="styleName"
                                   required
                                   th:value="${style.Style_name}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        </div>

                        <div>
                            <label for="basePrice" class="block text-sm font-medium text-gray-700 mb-1">Base Price (Tk)</label>
                            <input type="number"
                                   id="basePrice"
                                   name="basePrice"
                                   required
                                   step="0.01"
                                   min="0"
                                   th:value="${style.Base_Price}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        </div>

                        <div>
                            <label for="estimatedHours" class="block text-sm font-medium text-gray-700 mb-1">Estimated Labor Hours</label>
                            <input type="number"
                                   id="estimatedHours"
                                   name="estimatedHours"
                                   required
                                   step="0.1"
                                   min="0"
                                   th:value="${style.Estimated_Labor_Hours}"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        </div>

                        <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                            <a href="/styles"
                               class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">
                                Cancel
                            </a>
                            <button type="submit"
                                    class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">
                                Update
                            </button>
                        </div>
                    </form>

                    <div class="mt-8 border-t border-gray-200 pt-6">
                        <h3 class="text-lg font-medium text-gray-900 mb-4">Style Images (Max 5)</h3>
                        
                        <!-- Existing Images Grid -->
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6" th:if="${images != null and !images.empty}">
                            <div th:each="img : ${images}" class="relative bg-gray-100 rounded-lg overflow-hidden shadow-sm border border-gray-200">
                                <img th:src="${img.Image_Path}" alt="Style Image" class="w-full h-32 object-cover">
                                <form th:action="@{|/styles/${style.Style_ID}/images/${img.Image_ID}/delete|}" method="post" class="absolute top-1 right-1" onsubmit="return confirm('Delete this image?');">
                                    <button type="submit" class="bg-red-500 hover:bg-red-600 text-white p-1 rounded-full text-xs" title="Delete Image">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </form>
                            </div>
                        </div>
                        <p class="text-sm text-gray-500 mb-6" th:if="${images == null or images.empty}">No images uploaded yet.</p>

                        <!-- Upload Form -->
                        <form th:action="@{|/styles/${style.Style_ID}/images|}" method="post" enctype="multipart/form-data" class="flex items-center space-x-4">
                            <div class="flex-1">
                                <input type="file" name="images" multiple accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                            </div>
                            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded transition duration-150 ease-in-out">
                                Upload Images
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
